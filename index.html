<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Comic Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="tokenWarning" hidden>Kein Token gesetzt. <a href="#" id="tokenLink">Token eingeben</a>.</div>
  <header>
    <div class="head container">
      <div class="brand">
        <div class="logo">
          <img src="logo.png" alt="Comic Tracker Logo">
        </div>
        <div class="title">Comic Tracker</div>
      </div>
      <div class="actions">
        <label class="quick-toggle" title="Nur ungelesene anzeigen">
          <input id="quickHideRead" type="checkbox"> Nur ungelesene
        </label>
        <button id="toggleView" class="icon-btn" aria-label="Ansicht wechseln">
          <img src="icons/light-switch.png" class="icon" alt="" aria-hidden="true">
        </button>
        <button id="openFilters" class="icon-btn" aria-label="Menü">☰</button>
      </div>
    </div>
  </header>

  <div id="drawer" class="drawer" aria-hidden="true">
    <div class="shade" id="closeDrawer"></div>
    <aside class="panel" role="dialog" aria-modal="true">
      <h3>Suche & Filter</h3>
      <div class="grid">
        <div class="field span-2">
          <label for="mq">Suche</label>
          <input id="mq" type="text" placeholder="Suche…">
          <button class="clear-btn" id="clearSearch" aria-label="Suche löschen">×</button>
        </div>
        <div class="field"><label for="mseries">Serie</label><select id="mseries"><option value="">Alle Serien</option></select></div>
        <div class="field"><label for="myear">Jahr</label><select id="myear"><option value="">Alle Jahre</option></select></div>
        <div class="field"><label for="mevent">Event</label><select id="mevent"><option value="">Alle Events</option></select></div>
        <div class="field"><label for="mchar">Figur</label><select id="mchar"><option value="">Alle Figuren</option></select></div>
        <div class="field">
          <label for="msort">Sortierung</label>
          <select id="msort">
            <option value="dateAsc">Datum ↑</option>
            <option value="dateDesc">Datum ↓</option>
            <option value="titleAsc">Titel A–Z</option>
            <option value="titleDesc">Titel Z–A</option>
          </select>
        </div>
        <div class="drawer-actions">
          <button id="mResetFilters" class="ghost-btn danger" style="flex:1">Alle Filter zurücksetzen</button>
          <button id="closeDrawerBtn" class="ghost-btn" style="flex:1">Fertig</button>
        </div>
      </div>
    </aside>
  </div>

  <dialog id="tokenDialog">
    <form id="tokenForm">
      <label for="tokenInput">GitHub Token</label>
      <input id="tokenInput" type="password" />
      <button type="submit">Speichern</button>
    </form>
  </dialog>

  <main class="container">
    <div class="stats">
      <span class="badge"><strong id="count">0</strong> Einträge</span>
      <span class="badge">Gelesen: <strong id="readCount">0</strong></span>
      <div class="bar"><i id="progress"></i></div>
    </div>
    <div id="grid" class="grid"></div>
    <div id="empty" hidden>Keine Treffer.</div>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
