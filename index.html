<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Batman Comic Guide</title>
  <style>
    :root{ --bg:#0b0d12; --bg-soft:#11141b; --ink:#e7ecf3; --muted:#9aa4b2; --accent:#f1c40f; --accent-2:#ffd761; --outline:#1c2230; --ok:#31c48d; --danger:#f05252; }
    html,body{height:100%}
    body{margin:0; background:linear-gradient(180deg, #0a0c11 0%, #080a0f 100%); color:var(--ink); font:15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial;}
    .no-scroll{overflow:hidden}
    .container{max-width:1200px; margin:0 auto; padding:24px;}

    header{position:sticky; top:0; z-index:50; backdrop-filter:saturate(1.2) blur(8px); background:linear-gradient(180deg, rgba(10,12,17,.9) 0%, rgba(10,12,17,.65) 100%); border-bottom:1px solid var(--outline);}
    .head{display:flex; justify-content:space-between; padding:14px 24px; align-items:center}
    .brand{display:flex; align-items:center; gap:12px}
    .logo{width:44px; height:44px; display:grid; place-items:center; border-radius:12px; background:#1b1f2a; border:1px solid var(--outline)}
    .logo svg{width:28px; height:28px; fill:var(--accent)}
    .title{font-size:20px; font-weight:700}
    .subtitle{color:var(--muted); font-size:13px}

    .icon-btn{display:inline-grid; place-items:center; width:38px; height:38px; border-radius:10px; border:1px solid var(--outline); background:#0f1320; color:var(--ink); cursor:pointer}
    .icon-btn:hover{border-color:#2b3346}

    /* Drawer */
    .drawer{position:fixed; inset:0; display:none; z-index:10000}
    .drawer.open{display:block}
    .drawer .shade{position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .25s ease}
    .drawer.open .shade{opacity:.55; pointer-events:auto}
    .drawer .panel{position:absolute; right:0; top:0; bottom:0; width:92%; max-width:420px; background:rgba(11,15,24,0.9); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); border-left:1px solid var(--outline); padding:18px; overflow:auto; box-shadow:-10px 0 30px rgba(0,0,0,.45); transform:translateX(100%); transition:transform .25s ease}
    .drawer.open .panel{transform:translateX(0)}
    .drawer h3{margin:0 0 12px 0; font-size:16px}
    .drawer .grid{display:grid; gap:12px}
    .field{position:relative}
    .field label{color:var(--muted); font-size:12px; display:block; margin-bottom:6px}
    .field input,.field select{background:var(--bg-soft); color:var(--ink); border:1px solid var(--outline); border-radius:12px; padding:10px 36px 10px 12px; outline:none; width:100%}
    .field.span-2{grid-column:1 / -1}
    .clear-btn{position:absolute; right:8px; top:28px; width:22px; height:22px; border:1px solid var(--outline); border-radius:50%; background:#0f1320; color:#ccc; cursor:pointer; display:none; line-height:20px}
    .field input:not(:placeholder-shown) + .clear-btn{display:block}
    .drawer-actions{display:flex; gap:8px}
    .ghost-btn{background:#0f1320; color:var(--ink); border:1px solid var(--outline); border-radius:10px; padding:10px 12px; cursor:pointer; font-size:13px}
    .ghost-btn.danger{color:#ffd1d1; border-color:#5b2a2a; background:#1a0f0f}

    .stats{display:flex; gap:14px; align-items:center; flex-wrap:wrap; color:var(--muted); padding:2px 24px 16px}
    .badge{display:inline-flex; gap:6px; align-items:center; background:#0f1320; border:1px solid var(--outline); padding:6px 10px; border-radius:999px; font-size:12px}
    .bar{flex:1; height:10px; background:#0f1320; border:1px solid var(--outline); border-radius:999px; overflow:hidden}
    .bar>i{display:block; height:100%; width:0%; background:linear-gradient(90deg, var(--accent), var(--accent-2))}

    main{padding:8px 24px 40px}
    .grid{display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}

    .card{position:relative; border:1px solid var(--outline); background:#101521; border-radius:16px; overflow:hidden}
    .cover-wrap{position:relative; aspect-ratio:3/4.2; display:grid; place-items:center; background:#0c0f16; border-bottom:1px solid var(--outline)}
    .cover-wrap::after{content:""; position:absolute; inset:0; background: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.12) 50%, rgba(0,0,0,0) 80%); pointer-events:none; z-index:1}
    .cover{max-width:100%; max-height:100%; object-fit:contain; position:relative; z-index:0}

    .content{padding:10px 12px 12px; display:grid; gap:8px}
    .h{font-weight:700; font-size:14px}
    .meta{display:flex; gap:10px; flex-wrap:wrap; color:var(--muted); font-size:12px}
    .tag{border:1px solid var(--outline); padding:2px 8px; border-radius:999px}

    .read-toggle{position:absolute; top:10px; right:10px; z-index:2; padding:6px 10px; border-radius:12px; font-size:12px; font-weight:700; background:rgba(0,0,0,.6); border:1px solid var(--accent-2); color:var(--accent-2)}
    .read-toggle.active{border-color:var(--ok); color:#d9ffef}

    @media (min-width: 900px){ .drawer .grid{grid-template-columns:1fr 1fr} }
  </style>
</head>
<body>
  <header>
    <div class="head container">
      <div class="brand">
        <div class="logo"><svg viewBox="0 0 64 32"><path d="M32 4c-5 6-11-2-18 0 2 3 2 6 0 9-3-2-7-1-12 2 6 2 10 6 12 12 4-1 7-3 9-6 1 4 3 7 9 7s8-3 9-7c2 3 5 5 9 6 2-6 6-10 12-12-5-3-9-4-12-2-2-3-2-6 0-9-7-2-13 6-18 0z"/></svg></div>
        <div><div class="title">Batman Comic Guide</div><div class="subtitle">Dark, clean & schnell – mit Suche, Filtern & Fortschritt</div></div>
      </div>
      <button id="openFilters" class="icon-btn" title="Filter & Sortierung">☰</button>
    </div>
  </header>

  <div id="drawer" class="drawer" aria-hidden="true">
    <div class="shade" id="closeDrawer"></div>
    <aside class="panel" role="dialog" aria-modal="true">
      <h3>Suche & Filter</h3>
      <div class="grid">
        <div class="field span-2">
          <label for="mq">Suche</label>
          <input id="mq" type="text" placeholder="z.B. Hush, Joker…">
          <button class="clear-btn" id="clearSearch" aria-label="Suche löschen">×</button>
        </div>
        <div class="field"><label for="mseries">Serie</label><select id="mseries"><option value="">Alle Serien</option></select></div>
        <div class="field"><label for="myear">Jahr</label><select id="myear"><option value="">Alle Jahre</option></select></div>
        <div class="field"><label for="mevent">Event</label><select id="mevent"><option value="">Alle Events</option></select></div>
        <div class="field">
          <label for="msort">Sortierung</label>
          <select id="msort">
            <option value="dateAsc">Datum ↑</option>
            <option value="dateDesc">Datum ↓</option>
            <option value="titleAsc">Titel A–Z</option>
            <option value="titleDesc">Titel Z–A</option>
          </select>
        </div>
        <div class="field">
          <label for="hideRead">Anzeige</label>
          <label style="display:flex;align-items:center;gap:8px"><input id="hideRead" type="checkbox"> Gelesene ausblenden</label>
        </div>
        <div class="drawer-actions">
          <button id="mResetFilters" class="ghost-btn danger" style="flex:1">Alle Filter zurücksetzen</button>
          <button id="closeDrawerBtn" class="ghost-btn" style="flex:1">Fertig</button>
        </div>
      </div>
    </aside>
  </div>

  <main class="container">
    <div class="stats">
      <span class="badge"><strong id="count">0</strong> Einträge</span>
      <span class="badge">Gelesen: <strong id="readCount">0</strong></span>
      <div class="bar"><i id="progress"></i></div>
    </div>
    <div id="grid" class="grid"></div>
    <div id="empty" hidden>Keine Treffer.</div>
  </main>

  <script>
    const DATA_LIST_URL = './data/list.json';
    const DATA_FALLBACK_URL = './comics.json';
    const $ = sel => document.querySelector(sel);

    const state = { raw: [], view: [], readSet:new Set(JSON.parse(localStorage.getItem('batman-read')||'[]')) };
    const el = {
      grid:$('#grid'), empty:$('#empty'),
      mq:$('#mq'), mseries:$('#mseries'), myear:$('#myear'), mevent:$('#mevent'), msort:$('#msort'),
      hideRead:$('#hideRead'),
      count:$('#count'), readCount:$('#readCount'), progress:$('#progress'),
      openFilters:$('#openFilters'), drawer:$('#drawer'), closeDrawer:$('#closeDrawer'), closeDrawerBtn:$('#closeDrawerBtn'),
      mResetFilters:$('#mResetFilters'), clearSearch:$('#clearSearch')
    };

    // ein paar Demo-Einträge, wenn keine JSONs gefunden werden
    const DEMO_DATA = [
      {id:"batman_year_one", title:"Batman: Year One", issue:"404", year:1987, series:"Batman (1987)", cover:"https://upload.wikimedia.org/wikipedia/en/3/3d/Batman_404.png", event:"Year One", date:"1987-02-01"},
      {id:"killing_joke", title:"The Killing Joke", issue:"One-Shot", year:1988, series:"One-Shot (1988)", cover:"https://upload.wikimedia.org/wikipedia/en/9/9b/Batman_the_killing_joke.jpg", event:"Killing Joke", date:"1988-03-29"},
      {id:"hush_608", title:"Hush, Teil 1", issue:"608", year:2002, series:"Batman (2002)", cover:"https://upload.wikimedia.org/wikipedia/en/9/9f/Batman_Hush_cover.jpg", event:"Hush", date:"2002-10-01"}
    ];

    init();
    async function init(){
      let loaded = false;
      state.raw = [];
      try{
        const listRes = await fetch(DATA_LIST_URL, {cache:'no-store'});
        if(listRes.ok){
          const files = await listRes.json();
          if(Array.isArray(files) && files.length){
            const arrays = await Promise.all(
              files.map(p=> fetch(String(p), {cache:'no-store'}).then(r=> r.ok?r.json():[]).catch(()=>[]))
            );
            const merged = arrays.flat();
            if(merged && merged.length){ state.raw = merged; loaded = true; }
          }
        }
      }catch(e){ console.warn('Liste konnte nicht geladen werden', e); }

      if(!loaded){
        try{
          const res = await fetch(DATA_FALLBACK_URL, {cache:'no-store'});
          if(res.ok){
            const data = await res.json();
            state.raw = Array.isArray(data) ? data : (data.items || []);
            loaded = state.raw.length>0;
          }
        }catch(e){ console.warn('Fallback konnte nicht geladen werden', e); }
      }

      if(!loaded){ state.raw = DEMO_DATA.slice(); }

      const seen = new Set();
      state.raw = state.raw.filter(x=>{
        const id = (x.id || `${x.series||''}#${x.issue||''}-${x.title||''}`).toLowerCase();
        if(seen.has(id)) return false; seen.add(id); return true;
      });

      buildFilters();
      bindUI();
      apply();
    }

    function buildFilters(){
      const items = state.raw.map(normalize);
      const bySeries=new Set(items.map(x=>x.series).filter(Boolean));
      const byEvent=new Set(items.map(x=>x.event).filter(Boolean));
      const byYear=new Set(items.map(x=>x.year).filter(Boolean));
      fillSelect(el.mseries,['Alle Serien',...bySeries]);
      fillSelect(el.mevent,['Alle Events',...byEvent]);
      fillSelect(el.myear,['Alle Jahre',...Array.from(byYear).sort((a,b)=>a-b)]);
    }
    function fillSelect(sel,items){ sel.innerHTML=items.map((v,i)=>`<option value="${i? v:''}">${v}</option>`).join(''); }

    function bindUI(){
      el.openFilters?.addEventListener('click',()=>drawer(true));
      el.closeDrawer?.addEventListener('click',()=>drawer(false));
      el.closeDrawerBtn?.addEventListener('click',()=>drawer(false));
      window.addEventListener('keydown', (e)=>{ if(e.key==='Escape') drawer(false); });

      el.mResetFilters?.addEventListener('click',()=>{
        el.mseries.value=''; el.myear.value=''; el.mevent.value=''; el.msort.value='dateAsc';
        el.mq.value=''; el.hideRead.checked=false; apply();
      });
      el.clearSearch?.addEventListener('click',()=>{ el.mq.value=''; apply(); });

      [el.mq, el.mseries, el.myear, el.mevent, el.msort, el.hideRead]
        .forEach(c=>c && c.addEventListener('input', apply));
    }
    function drawer(open){ el.drawer.classList.toggle('open',open); document.body.classList.toggle('no-scroll',open); }

    function normalize(item){
      const id=(item.id||`${item.series||''}#${item.issue||''}-${item.title||''}`).toLowerCase().replace(/\s+/g,'_');
      const ts=item.date? new Date(item.date).getTime(): (item.year? new Date(Number(item.year),0,1).getTime():0);
      return { ...item, id, ts };
    }

    function formatDateDE(dateRaw, year){
      if(dateRaw){
        const d=new Date(dateRaw);
        if(!isNaN(d)) return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getFullYear()%100).padStart(2,'0')}`;
      }
      if(year) return `01.01.${String(Number(year)%100).padStart(2,'0')}`;
      return '';
    }
    function shortSeries(s){ const m=/^(.*)\((\d{4})\)\s*$/.exec(String(s||'').trim()); return m ? `${m[1].trim()} ’${String(m[2]).slice(2)}` : (s||''); }
    function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[m])); }

    function apply(){
      const q=(el.mq.value||'').toLowerCase().trim();
      const fSeries=el.mseries.value; const fYear=el.myear.value; const fEvent=el.mevent.value;
      const hideRead = !!(el.hideRead && el.hideRead.checked);

      let items=state.raw.map(normalize).filter(x=>{
        if(fSeries && x.series!==fSeries) return false;
        if(fYear && String(x.year)!==String(fYear)) return false;
        if(fEvent && x.event!==fEvent) return false;
        if(hideRead && state.readSet.has(x.id)) return false;
        if(q){
          const hay=`${x.title} ${x.series} ${x.event}`.toLowerCase();
          if(!q.split(/\s+/).every(tok=>hay.includes(tok))) return false;
        }
        return true;
      });

      switch(el.msort.value){
        case'dateAsc':items.sort((a,b)=>a.ts-b.ts||a.title.localeCompare(b.title));break;
        case'dateDesc':items.sort((a,b)=>b.ts-a.ts||a.title.localeCompare(b.title));break;
        case'titleAsc':items.sort((a,b)=>a.title.localeCompare(b.title));break;
        case'titleDesc':items.sort((a,b)=>b.title.localeCompare(a.title));break;
      }

      state.view=items;
      render();
    }

    function render(){
      el.grid.innerHTML='';
      state.view.forEach(x=>{
        const isRead = state.readSet.has(x.id);
        const card=document.createElement('article');
        card.className='card';
        card.innerHTML=`
          <button class="read-toggle ${isRead?'active':''}" aria-pressed="${isRead}" data-id="${escapeHtml(x.id)}">${isRead?'Gelesen':'Ungelesen'}</button>
          <div class="cover-wrap">
            ${x.cover
              ? `<img class="cover" alt="${escapeHtml(x.title)} Cover" loading="lazy" decoding="async"
                     src="${escapeHtml(x.cover)}" referrerpolicy="no-referrer" crossorigin="anonymous"
                     onerror="this.style.display='none'; this.closest('.cover-wrap').insertAdjacentHTML('beforeend', '<div class=\\'tag\\' style=\\'opacity:.7\\'>Kein Cover</div>');">`
              : '<div class="tag" style="opacity:.7">Kein Cover</div>'}
          </div>
          <div class="content">
            <div class="h">${escapeHtml(x.title)}${x.issue?` <small style="color:var(--muted)">#${escapeHtml(x.issue)}</small>`:''}</div>
            <div class="meta">
              ${x.date?`<span class="tag">${formatDateDE(x.date,x.year)}</span>`:(x.year?`<span class="tag">01.01.${String(Number(x.year)%100).padStart(2,'0')}</span>`:'')}
              ${x.series?`<span class="tag">${escapeHtml(shortSeries(x.series))}</span>`:''}
              ${x.event?`<span class="tag">${escapeHtml(x.event)}</span>`:''}
            </div>
          </div>`;
        card.querySelector('.read-toggle').addEventListener('click',()=>{
          if(state.readSet.has(x.id)) state.readSet.delete(x.id); else state.readSet.add(x.id);
          localStorage.setItem('batman-read', JSON.stringify([...state.readSet]));
          render();
        });
        el.grid.appendChild(card);
      });
      el.empty.hidden=state.view.length>0;
      el.count.textContent=state.view.length;

      const rawIds = new Set(state.raw.map(it => (it.id || `${it.series||''}#${it.issue||''}-${it.title||''}`).toLowerCase().replace(/\s+/g,'_')));
      const read = [...state.readSet].filter(id => rawIds.has(id)).length;
      el.readCount.textContent = String(read);
      const total = state.raw.length || 1;
      const pct = Math.min(100, Math.round((read/total)*100));
      el.progress.style.width = pct + '%';
      el.progress.title = pct + '% abgeschlossen';
    }
  </script>
</body>
</html>
